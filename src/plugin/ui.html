<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Companion</title>
  <style>
    :root{color-scheme:light;--page:#f7f8f7;--surface:#fff;--surface-soft:#f2f4f2;--text:#232a26;--muted:#7c847e;--subtle:#9da59e;--line:#e8ece8;--accent:#32745a;--accent-ink:#fff;--accent-soft:#e8f0e9;--hover:#eef2ee;--shadow:0 8px 36px #1f342108;--hg-panel-color:var(--text);--hg-header-bg:var(--surface);--hg-header-color:var(--muted);--hg-divider:var(--line);--hg-hover-bg:var(--hover);--hg-input-bg:var(--surface-soft);--hg-font-family:inherit;--cc-card-bg:var(--surface);--cc-card-fg:var(--text);--cc-card-border:var(--line);font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif);font-size:14px;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased;font-synthesis:none}
    :root[data-theme=dark]{color-scheme:dark;--page:#171b18;--surface:#202622;--surface-soft:#282f2a;--text:#e8eee9;--muted:#a1ada4;--subtle:#758379;--line:#343d36;--accent:#9fc6a9;--accent-ink:#17251b;--accent-soft:#2b3a30;--hover:#303b33;--shadow:0 8px 36px #0002}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--page:#171b18;--surface:#202622;--surface-soft:#282f2a;--text:#e8eee9;--muted:#a1ada4;--subtle:#758379;--line:#343d36;--accent:#9fc6a9;--accent-ink:#17251b;--accent-soft:#2b3a30;--hover:#303b33;--shadow:0 8px 36px #0002}}
    *{box-sizing:border-box}html,body{margin:0;min-width:260px;min-height:100%;scrollbar-width:thin}body{min-height:100dvh}button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default;opacity:.4}button,a,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,[role=tabpanel]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button svg,svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}button{transition:background .15s,color .15s,opacity .15s}button:hover:not(:disabled){filter:brightness(.98)}[hidden]{display:none!important}h1,h2,p{margin:0}a{color:inherit}
    .app-shell{display:grid;grid-template-columns:172px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr);min-height:100dvh;isolation:isolate}.app-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:16px;font-weight:650;letter-spacing:-.35px}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:var(--accent-soft);color:var(--accent)}.brand-mark svg{width:21px;height:21px;stroke-width:1.7}.brand-caption{display:block;margin-top:2px;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:1px}.header-actions{display:flex;align-items:center;gap:7px}.connection{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-right:8px;white-space:nowrap}.connection i,.soft-dot{display:inline-block;width:5px;height:5px;flex:none;border-radius:50%;background:#b8bbad}.connection[data-state=ready] i{background:#65a67b;box-shadow:0 0 0 3px #65a67b14}.connection[data-state=error] i{background:#c98062}.icon-button{display:grid;place-items:center;border:1px solid transparent;border-radius:9px;padding:0;background:transparent;width:32px;height:32px;flex:none;color:var(--muted)}.icon-button svg{width:17px;height:17px}.icon-button:hover{background:var(--hover);color:var(--text)}
    .sidebar{display:flex;flex-direction:column;min-width:0;padding:29px 16px 20px;border-right:1px solid var(--line);background:var(--surface)}.nav-caption{font-size:10px;color:var(--subtle);letter-spacing:1.5px;padding:0 13px;margin-bottom:16px}.card-nav{display:flex;flex-direction:column;gap:7px}.nav-tab{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:43px;text-align:left;padding:9px 12px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}.nav-tab:hover{background:var(--surface-soft);color:var(--text)}.nav-tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}.nav-icon{display:grid;place-items:center}.nav-icon svg{width:18px;height:18px}.active-marker{display:none;width:4px;height:4px;margin-left:auto;border-radius:50%;background:currentColor}.nav-tab[aria-selected=true] .active-marker{display:block}.sidebar-footer{display:flex;align-items:center;gap:7px;font-size:9px;color:var(--subtle);margin-top:auto;padding:40px 8px 0;white-space:nowrap}.sidebar-footer .soft-dot{background:var(--subtle);width:4px;height:4px}
    .workspace{display:flex;flex-direction:column;min-width:0;padding:32px clamp(18px,4vw,52px) 28px;max-width:1160px;width:100%;margin:0 auto;gap:23px}.page-intro{display:flex;align-items:center;justify-content:space-between;gap:15px;flex:none;min-height:82px}.eyebrow{color:var(--subtle);font-size:10px;letter-spacing:1px;line-height:1.5;margin-bottom:8px}h1{font-size:25px;font-weight:620;line-height:1.25;letter-spacing:-.9px}.page-description{font-size:11px;color:var(--muted);line-height:1.6;margin-top:9px}.page-emblem{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:17px;background:var(--accent-soft);color:var(--accent);transform:rotate(-5deg)}.page-emblem svg{width:25px;height:25px;transform:rotate(5deg);stroke-width:1.4}[data-tone=rose].page-emblem,[data-tone=rose].settings-card-icon{background:#f7e8e7;color:#b56b6a}[data-tone=amber].page-emblem,[data-tone=amber].settings-card-icon{background:#f7eedc;color:#aa8746}[data-tone=violet].page-emblem,[data-tone=violet].settings-card-icon{background:#eeebf7;color:#8b78ae}[data-tone=slate].page-emblem,[data-tone=slate].settings-card-icon{background:#e9eef0;color:#71828b}
    .card-stack{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0}.plugin-card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:clip;contain:style}.card-content{min-width:0;min-height:0;flex:1}.viewport-card{height:max(420px,calc(100dvh - 246px));max-height:1100px}.viewport-card>.card-content{height:100%}.content-card .card-content{width:100%}.plugin-card[data-card=games]{max-width:640px;width:100%;margin-inline:auto}.plugin-card[data-card=proxy]{margin-top:8px}.card-error,.startup,.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:350px;padding:28px 18px;flex:1}.card-error h2,.startup h2,.empty-state h2{font-size:16px;font-weight:600;letter-spacing:-.3px}.card-error p,.startup p,.empty-state p{max-width:360px;font-size:12px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}.card-error{height:100%}.empty-state{border:1px dashed var(--line);border-radius:20px;min-height:440px}.empty-symbol{display:grid;place-items:center;border:1px solid var(--line);width:58px;height:58px;border-radius:18px;background:var(--surface);color:var(--accent);margin-bottom:5px}.empty-symbol svg{width:25px;height:25px}.empty-state .button{margin-top:8px}.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:6px}@keyframes spin{to{transform:rotate(360deg)}}
    .button{font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;min-height:36px;white-space:nowrap}.button:hover{background:var(--hover)}.button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.toast{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);border:1px solid var(--line);box-shadow:0 4px 24px #0002;background:var(--surface);color:var(--text);padding:11px 16px;border-radius:12px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .settings-dialog{padding:24px;border:1px solid var(--line);border-radius:23px;box-shadow:0 24px 100px #0003;color:var(--text);background:var(--surface);width:min(450px,calc(100% - 28px));max-height:calc(100dvh - 40px);overflow:auto}.settings-dialog::backdrop{background:#10251b42;backdrop-filter:blur(4px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.dialog-head h2{font-size:21px;letter-spacing:-.6px;font-weight:620}.dialog-head .eyebrow{display:block;font-size:10px;margin-bottom:5px}.dialog-description{font-size:11px;color:var(--muted);line-height:1.7;margin:16px 0 18px}.master-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 13px;border:1px solid var(--line);background:var(--page);border-radius:13px;margin-bottom:14px;cursor:pointer}.master-toggle strong{display:block;font-size:12px;font-weight:550}.master-toggle small{display:block;color:var(--muted);font-size:10px;margin-top:5px}input[role=switch]{appearance:none;-webkit-appearance:none;position:relative;display:inline-block;flex:none;width:33px;height:20px;background:var(--line);border:1px solid transparent;border-radius:20px;vertical-align:middle;cursor:pointer;margin:0;transition:background .15s}input[role=switch]:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:transform .15s}input[role=switch]:checked{background:#4c8866}input[role=switch]:checked:before{transform:translateX(13px)}input[role=switch]:disabled{opacity:.45;cursor:default}.settings-list{display:flex;flex-direction:column;gap:2px}.settings-row{display:flex;align-items:center;gap:10px;padding:10px 1px;border-bottom:1px solid var(--line)}.settings-row:last-child{border:0}.settings-card-icon{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:var(--accent-soft);color:var(--accent);flex:none}.settings-card-icon svg{width:17px;height:17px}.settings-card-label{flex:1;min-width:0;font-size:12px}.order-actions{display:flex;align-items:center;margin-right:4px}.order-actions .icon-button{width:27px;height:28px;border-radius:7px}.settings-status{font-size:10px;line-height:1.6;color:var(--muted);min-height:17px;margin-top:10px}.dialog-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:15px;padding-top:17px}.dialog-footer>span{font-size:10px;color:var(--subtle)}.dialog-footer .button{background:var(--accent-soft);color:var(--accent);border-color:transparent;min-width:68px}
    .launcher-settings{border-top:1px solid var(--line);margin-top:18px;padding-top:19px}.launcher-settings h3{font-size:12px;font-weight:600;margin:0 0 15px}.launcher-toggle,.port-field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;margin:12px 0}.launcher-toggle{cursor:pointer}.port-input{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--page);font-size:10px;color:var(--muted)}.port-input input{width:52px;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:11px;padding:3px 0}.port-input input::-webkit-inner-spin-button{appearance:none}.launcher-note{font-size:10px;line-height:1.7;color:var(--muted);margin:12px 0}.launcher-actions{display:flex;justify-content:flex-end;gap:8px}.launcher-actions .button{font-size:10px;min-height:32px;padding:7px 11px}.launcher-actions .relaunch-codex{background:var(--accent-soft);color:var(--accent);border-color:transparent}.launcher-status{font-size:10px;line-height:1.6;color:var(--muted);min-height:16px;margin-top:8px}
    .exit-codex{display:block;width:100%;margin-top:10px;font-size:10px;min-height:32px;padding:7px 11px;color:var(--muted);background:transparent}.confirmation-dialog{width:min(370px,calc(100% - 36px));padding:25px;border:1px solid var(--line);border-radius:21px;box-shadow:0 24px 100px #0003;background:var(--surface);color:var(--text)}.confirmation-dialog::backdrop{background:#10251b42;backdrop-filter:blur(4px)}.confirmation-symbol{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);margin-bottom:16px}.confirmation-symbol svg{width:19px;height:19px}.confirmation-dialog h2{font-size:18px;letter-spacing:-.4px}.confirmation-dialog p{font-size:12px;color:var(--muted);line-height:1.8;margin-top:12px}.confirmation-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.button.primary.danger{background:#b94d50;border-color:#b94d50;color:#fff}
    @media(min-width:1100px){.workspace{padding-top:38px}.app-header{padding-inline:32px}.sidebar{padding-inline:20px}.app-shell{grid-template-columns:190px minmax(0,1fr)}}
    /* 会话侧栏把空间留给卡片；宽页仍保留完整的页面导航与介绍。 */
    @media(max-width:700px){
      .app-shell{display:flex;flex-direction:column;min-height:100dvh}
      .app-header{height:44px;min-height:44px;padding-inline:12px}
      .brand{font-size:13px;gap:8px}.brand-mark{width:24px;height:24px;border-radius:7px}.brand-mark svg{width:16px;height:16px}.brand-caption{display:none}
      .sidebar{display:block;padding:8px 10px 0;border:0;background:var(--page)}.nav-caption,.sidebar-footer{display:none}
      .card-nav{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 1px 6px}.card-nav::-webkit-scrollbar{display:none}
      .nav-tab{flex:none;width:auto;min-height:32px;gap:6px;padding:7px 10px;font-size:11px;border-radius:8px}.nav-icon svg{width:14px;height:14px}.active-marker{display:none!important}
      .workspace{padding:10px 12px 12px;gap:0;flex:1}
      /* 保留 h1 的文档语义，屏幕上由 tab 与卡片本身标注当前功能。 */
      .page-intro{position:absolute;width:1px;height:1px;min-height:0;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;pointer-events:none}
      .page-emblem{display:none}.viewport-card{height:max(320px,calc(100dvh - 112px));max-height:none}
      .plugin-card{border-radius:12px;box-shadow:none}.plugin-card[data-card=games]{max-width:360px}.plugin-card[data-card=proxy]{margin-top:0}
      .connection{font-size:9px;margin-right:3px;gap:5px}.header-actions{gap:3px}.icon-button{width:29px;height:29px}.settings-dialog{padding:21px}.empty-state{min-height:300px}
    }
    @media(max-width:370px){.app-header{padding-inline:10px}.connection span{display:none}.connection{margin-right:5px}.workspace{padding-inline:10px}.sidebar{padding-inline:8px}.nav-tab{padding-inline:9px}.settings-dialog{padding:18px}.settings-card-label{font-size:11px}.settings-row{gap:8px}.order-actions{margin:0}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
